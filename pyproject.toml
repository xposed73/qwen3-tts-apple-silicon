[project]
name = "qwen3-tts-apple-silicon"
version = "0.1.0"
description = "Run Qwen3-TTS locally on Apple Silicon (M1/M2/M3/M4) with MLX, Gradio Web UI, and CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio>=5.0.0",
    "mlx>=0.30.0",
    "mlx-audio",
    "mlx-lm>=0.30.0",
    "mlx-metal>=0.30.0",
    "soundfile>=0.13.0",
    "scipy>=1.14.0",
    "numpy>=2.0.0",
    "transformers>=4.48.0",
    "huggingface-hub>=0.28.0",
    "tqdm>=4.67.0",
    "pyloudnorm>=0.2.0",
    "librosa>=0.10.0",
    "click>=8.1.0",
    "sounddevice>=0.5.0",
    "typer>=0.15.0",
]

[tool.uv]
package = false

[tool.uv.sources]
mlx-audio = { git = "https://github.com/Blaizzy/mlx-audio.git", rev = "9349644ccbd62eb10900852228f7b952c566def3" }
